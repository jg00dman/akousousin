name: Package Piper backend
on:
  workflow_dispatch:
  push:
    branches: [codex/deployable-piper]
    paths: [backend/**, .github/workflows/piper-backend.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned backend and packager
        run: python -m pip install ./backend pyinstaller==6.16.0
      - name: Unit tests
        run: python -m unittest discover -s backend/tests -v
      - name: Package binary, voice, licences and corresponding sources
        run: python backend/bundle.py
      - name: Test real synthesis using frozen binary
        run: python backend/smoke.py backend-dist/akousousin-piper
      - name: Upload package and sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: akousousin-backend-${{ github.run_id }}
          path: |
            backend-dist/*.tar.xz
            backend-dist/SHA256SUMS
            backend-dist/*.log
      - name: Publish separate backend beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "piper-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'Akousousin Piper backend beta' --notes-file backend/README.md \
            backend-dist/*.tar.xz backend-dist/SHA256SUMS
