name: Piper SAPI test AppImage

on:
  workflow_dispatch:
  push:
    branches: [main, codex/piper-sapi-prototype, codex/deployable-piper]
    paths:
      - .github/workflows/appimage.yml
      - scripts/ci/**
      - patches/**
      - examples/**
      - tests/**
      - scripts/*.sh
      - scripts/*.py

permissions:
  contents: read

concurrency:
  group: piper-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  environment:
    name: Prepare reusable build environment
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.identity.outputs.key }}
      image-id: ${{ steps.image.outputs.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identify dependency environment
        id: identity
        run: echo "key=wine-env-v1-${RUNNER_OS}-${RUNNER_ARCH}-${{ hashFiles('scripts/ci/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - name: Restore prepared dependency environment
        id: environment-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .ci-environment/image.tar
          key: ${{ steps.identity.outputs.key }}
      - name: Install dependencies into reusable image
        if: steps.environment-cache.outputs.cache-hit != 'true'
        run: |
          docker build --progress=plain -t opensapi-ci:build -f scripts/ci/Dockerfile scripts/ci
          mkdir -p .ci-environment
          docker save opensapi-ci:build -o .ci-environment/image.tar
      - name: Save dependency environment
        if: steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .ci-environment/image.tar
          key: ${{ steps.identity.outputs.key }}
      - name: Verify prepared toolchain identity
        id: image
        run: |
          docker load -i .ci-environment/image.tar
          echo "id=$(docker image inspect --format '{{.Id}}' opensapi-ci:build)" >> "$GITHUB_OUTPUT"
          docker run --rm opensapi-ci:build sh -c 'gcc --version; x86_64-w64-mingw32-gcc --version; bison --version; python3 --version'

  build:
    name: Build and validate AppImage
    needs: environment
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      WINE_REPOSITORY: https://github.com/FaithLife-Community/wine.git
      WINE_BASE: 3b19eb0e45ac5f57301073fc9e721cac7829dc93
      WINE_VERSION: '11.21-logos'
      CI_IMAGE_ID: ${{ needs.environment.outputs.image-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore dependency environment
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .ci-environment/image.tar
          key: ${{ needs.environment.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Load and verify dependency environment
        run: |
          docker load -i .ci-environment/image.tar
          test "$(docker image inspect --format '{{.Id}}' opensapi-ci:build)" = "$CI_IMAGE_ID"
          rm .ci-environment/image.tar
      - name: Identify compatible Wine build checkpoint
        id: build-key
        env:
          INPUT_HASH: ${{ hashFiles('patches/wine-piper.patch', 'patches/wine-sapi-enum-values.patch', 'patches/wine-piper-site-write.patch', 'patches/wine-piper-lifecycle.patch', 'scripts/ci/configure-wine.sh') }}
          WRITE_INPUT_HASH: ${{ hashFiles('patches/wine-piper.patch', 'patches/wine-sapi-enum-values.patch', 'patches/wine-piper-site-write.patch', 'scripts/ci/configure-wine.sh') }}
          ENUM_INPUT_HASH: ${{ hashFiles('patches/wine-piper.patch', 'patches/wine-sapi-enum-values.patch', 'scripts/ci/configure-wine.sh') }}
          BASE_INPUT_HASH: ${{ hashFiles('patches/wine-piper.patch', 'scripts/ci/configure-wine.sh') }}
        run: |
          prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CI_IMAGE_ID#sha256:}-${WINE_BASE}"
          echo "key=wine-build-v2-${prefix}-${INPUT_HASH}" >> "$GITHUB_OUTPUT"
          # Reuse the existing Logos/Piper build; the additive token.c patch is
          # applied by the source stage and make rebuilds affected dependencies.
          {
            echo "lifecycle-base-key=wine-build-v2-${prefix}-${WRITE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
            # Only the inspected async checkpoint may migrate. This condition
            # includes the unchanged configure recipe and all earlier patches.
            if [ "$WRITE_INPUT_HASH" = 991891f8f0b2b1e5fde18e862c83dbd222c77c4d45de78b89ebefe13766d6b87 ]; then
              echo "async-base-key=wine-build-v2-${prefix}-bfdd9b89c5b81d76fbff7bc4e191f141ba4b90e6a331d782e8c3f9744df363a3" >> "$GITHUB_OUTPUT"
            fi
            echo "write-base-key=wine-build-v2-${prefix}-${ENUM_INPUT_HASH}"
            echo "enum-base-key=wine-build-v2-${prefix}-${BASE_INPUT_HASH}"
          } >> "$GITHUB_OUTPUT"
          # The inspected Logos tip changes source files only; reuse the exact
          # upstream/Piper checkpoint with the same toolchain and configure recipe.
          if [ "$WINE_BASE" = 9a962f8799c79149af0be85d8d8f7b92951c1cc5 ]; then
            echo "incremental-key=wine-build-v2-${RUNNER_OS}-${RUNNER_ARCH}-${CI_IMAGE_ID#sha256:}-2528aff26208257fdbf980666a4f0e66d47563ce-${INPUT_HASH}" >> "$GITHUB_OUTPUT"
          fi
          # The inspected two-revert update changes only three WineD3D files.
          # Match all patches, configure inputs and the verified toolchain.
          if [ "$WINE_BASE" = 3b19eb0e45ac5f57301073fc9e721cac7829dc93 ]; then
            echo "logos-revert-key=wine-build-v2-${RUNNER_OS}-${RUNNER_ARCH}-${CI_IMAGE_ID#sha256:}-9a962f8799c79149af0be85d8d8f7b92951c1cc5-${INPUT_HASH}" >> "$GITHUB_OUTPUT"
          fi
          # One-time migration of the successful 356c76c checkpoint. Its exact
          # source/patch, toolchain and configure flags match this recipe.
          # Never restore it for a different patch or configuration.
          if [ "$WINE_BASE" = 2528aff26208257fdbf980666a4f0e66d47563ce ] &&
             [ "$(sha256sum patches/wine-piper.patch | cut -d' ' -f1)" = e0d7bba62108d8d451dc13e544014ce62de0d6bfcdffefe417c9863f045806f1 ] &&
             [ "$(sha256sum scripts/ci/configure-wine.sh | cut -d' ' -f1)" = f8728ccf0e1c554a7b6e153af5c13ee6eaf742428dde64a1cd9e806f5f01be8e ]; then
            echo "legacy-key=wine-build-v1-${prefix}-01503c5d6d4d04e3eda048e8a499245d7b0a151cf6c45b4ae08cb94d795c7680" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore compiled Wine checkpoint
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            wine-src
            wine-build
          key: ${{ steps.build-key.outputs.key }}
          restore-keys: |
            ${{ steps.build-key.outputs.lifecycle-base-key }}
            ${{ steps.build-key.outputs.write-base-key }}
            ${{ steps.build-key.outputs.enum-base-key }}
            ${{ steps.build-key.outputs.async-base-key }}
            ${{ steps.build-key.outputs.logos-revert-key }}
            ${{ steps.build-key.outputs.incremental-key }}
            ${{ steps.build-key.outputs.legacy-key }}
      - name: Prepare exact Wine source and apply patch
        timeout-minutes: 10
        run: bash scripts/ci/run-stage.sh source
      - name: Configure Wine without unrelated regression executables
        timeout-minutes: 12
        run: bash scripts/ci/run-stage.sh configure
      - name: Compile Wine
        timeout-minutes: 125
        run: bash scripts/ci/run-stage.sh compile
      - name: Save compiled Wine before testing or packaging
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            wine-src
            wine-build
          key: ${{ steps.build-key.outputs.key }}
      - name: Install Wine into AppDir
        timeout-minutes: 12
        run: bash scripts/ci/run-stage.sh install
      - name: Build OpenSAPI diagnostic probes
        timeout-minutes: 6
        run: bash scripts/ci/run-stage.sh probes
      - name: Run all 13 build-tree integration tests
        timeout-minutes: 15
        run: bash scripts/ci/run-stage.sh build-tests
      - name: Assemble AppDir and test instructions
        timeout-minutes: 5
        run: bash scripts/ci/run-stage.sh assemble
      - name: Create checksum-verified AppImage
        timeout-minutes: 10
        run: bash scripts/ci/run-stage.sh appimage
      - name: Run all 13 packaged integration tests and AppImage checks
        timeout-minutes: 16
        run: bash scripts/ci/run-stage.sh package-tests
      - name: Verify real speech through packaged Wine and separate Piper backend
        timeout-minutes: 8
        run: bash scripts/ci/run-stage.sh real-piper-test
      - name: Archive matching source and compute release checksums
        timeout-minutes: 15
        run: |
          bash scripts/ci/run-stage.sh archives
          cat AppDir/usr/share/opensapi/BUILD-INFO.txt build/integration.log build/packaged-integration.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: piper-appimage-logs-${{ github.run_id }}
          path: |
            build/*.log
            build/real-piper/backend.log
            wine-build/config.log
          if-no-files-found: ignore
      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-piper-appimage-${{ github.run_id }}
          path: dist/*
      - name: Publish a unique experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="piper-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Piper SAPI test build ${GITHUB_RUN_ID}" \
            --notes-file build/RELEASE-NOTES.md dist/*
