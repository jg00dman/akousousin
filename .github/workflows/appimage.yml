name: Piper SAPI test AppImage

on:
  workflow_dispatch:
  push:
    branches: [codex/piper-sapi-prototype]
    paths:
      - .github/workflows/appimage.yml
      - scripts/ci/**
      - patches/**
      - examples/**
      - scripts/build-probes.sh

permissions:
  contents: write

concurrency:
  group: piper-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      WINE_BASE: 2528aff26208257fdbf980666a4f0e66d47563ce
      WINE_VERSION: '11.21'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install signed distribution build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex pkg-config gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 libasound2-dev libpulse-dev libdbus-1-dev \
            libfontconfig1-dev libfreetype-dev libgnutls28-dev libunwind-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxfixes-dev \
            libgl-dev libosmesa6-dev libvulkan-dev libudev-dev \
            libusb-1.0-0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpng-dev libjpeg-dev libtiff-dev libxml2-dev libxslt1-dev \
            libpcap-dev liblcms2-dev libzstd-dev zlib1g-dev \
            squashfs-tools xz-utils curl git python3 xvfb xauth
      - name: Build patched Wine and test package
        timeout-minutes: 165
        run: bash scripts/ci/build-appimage.sh
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: piper-appimage-logs-${{ github.run_id }}
          path: |
            build/*.log
            wine-build/config.log
          if-no-files-found: ignore
      - name: Upload test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-piper-appimage-${{ github.run_id }}
          path: dist/*
      - name: Publish a unique experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="piper-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Piper SAPI test build ${GITHUB_RUN_ID}" \
            --notes-file build/RELEASE-NOTES.md dist/*
