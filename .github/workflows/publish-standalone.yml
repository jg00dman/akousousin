name: Publish tested standalone OpenSAPI
on:
  workflow_dispatch:
    inputs:
      tested_run:
        description: Completed standalone build run whose Linux and Windows tests passed
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify tested build and its existing unique tag
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tested_run }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          jobs = json.load(open('jobs.json'))['jobs']
          assert run['head_branch'] == 'codex/standalone-control-panel'
          assert run['path'] == '.github/workflows/standalone.yml'
          assert run['status'] == 'completed'
          for name in ('engine', 'package (ubuntu-22.04)', 'package (windows-2022)'):
              assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
          tag="standalone-beta-${SOURCE_RUN}-1"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          expected=$(python3 -c "import json; print(json.load(open('run.json'))['head_sha'])")
          [[ "$actual" == "$expected" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ steps.tested.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: opensapi-standalone-*
          path: release-input
          run-id: ${{ inputs.tested_run }}
          github-token: ${{ github.token }}
      - name: Check hashes and prepare program-only assets
        shell: bash
        run: |
          mkdir release-assets
          for directory in release-input/*/standalone-dist; do
            (cd "$directory" && tr -d '\r' < SHA256SUMS | sha256sum --check -)
            find "$directory" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          done
          cp standalone/README.md release-assets/TESTING.md
          cp patches/wine-piper.patch release-assets/wine-piper-original.patch
          (cd release-assets && sha256sum -- *.AppImage *.zip *.tar.gz TESTING.md *.patch > SHA256SUMS)
      - name: Publish unique beta without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tested_run }}
        run: |
          gh release create "standalone-beta-${SOURCE_RUN}-1" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "OpenSAPI standalone beta ${SOURCE_RUN}" \
            --notes-file standalone/RELEASE-NOTES.md release-assets/*
