name: Publish tested standalone Akousousin
on:
  push:
    branches: [codex/standalone-control-panel]
    paths: [.github/workflows/publish-standalone.yml]
  workflow_dispatch:
    inputs:
      tested_run:
        description: Completed standalone build run whose Linux and Windows tests passed
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify tested build and prepare its versioned tag
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tested_run }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          jobs = json.load(open('jobs.json'))['jobs']
          assert run['head_branch'] in ('main', 'codex/standalone-control-panel', 'codex/control-panel-updates')
          assert run['path'] == '.github/workflows/standalone.yml'
          assert run['status'] == 'completed'
          for name in ('engine', 'package (ubuntu-22.04)', 'package (windows-2022)'):
              assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
          source_sha=$(python3 -c "import json; print(json.load(open('run.json'))['head_sha'])")
          gh api "repos/$GITHUB_REPOSITORY/contents/standalone/pyproject.toml?ref=$source_sha" --jq '.content' | base64 -d > project.toml
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' project.toml)
          tag="standalone-beta-${version}-${SOURCE_RUN}-1"
          expected=$(python3 -c "import json; print(json.load(open('run.json'))['head_sha'])")
          if actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            [[ "$actual" == "$expected" ]]
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$expected"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ steps.tested.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: akousousin-standalone-*
          path: release-input
          run-id: ${{ inputs.tested_run }}
          github-token: ${{ github.token }}
      - name: Check hashes and prepare program-only assets
        shell: bash
        run: |
          mkdir release-assets
          for directory in release-input/*/standalone-dist; do
            (cd "$directory" && tr -d '\r' < SHA256SUMS | sha256sum --check -)
            find "$directory" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          done
          sed 's#../COMPATIBILITY.md#COMPATIBILITY.md#g' standalone/README.md > release-assets/TESTING.md
          cp COMPATIBILITY.md release-assets/COMPATIBILITY.md
          cp patches/wine-piper.patch release-assets/wine-piper-original.patch
          (cd release-assets && sha256sum -- *.AppImage *.zip *.tar.gz TESTING.md COMPATIBILITY.md *.patch > SHA256SUMS)
      - name: Publish unique beta without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.tested_run }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' standalone/pyproject.toml)
          gh release create "standalone-beta-${version}-${SOURCE_RUN}-1" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "Akousousin standalone beta ${SOURCE_RUN}" \
            --notes-file standalone/RELEASE-NOTES.md release-assets/*
