name: Standalone OpenSAPI
on:
  workflow_dispatch:
  push:
    branches: [codex/standalone-control-panel]
    paths: [engine/**, standalone/**, .github/workflows/standalone.yml]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install cross compiler (no Wine compilation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build standard Windows engine DLL and test clients
        run: sh engine/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-engine
          path: build/standalone-engine/*
