name: Standalone OpenSAPI
on:
  workflow_dispatch:
  push:
    branches: [codex/standalone-control-panel]
    paths: [engine/**, standalone/**, .github/workflows/standalone.yml]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install cross compiler (no Wine compilation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build standard Windows engine DLL and test clients
        run: sh engine/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-engine
          path: build/standalone-engine/*

  package:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-engine
          path: build/standalone-engine
      - name: Install Linux packaging/test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools xvfb xauth
      - name: Install pinned Python backend and packager
        run: python -m pip install ./backend pyinstaller==6.16.0 pillow
      - name: Unit tests
        shell: bash
        run: PYTHONPATH=standalone:backend python -m unittest discover -s standalone/tests -v
        if: runner.os == 'Linux'
      - name: Build program-only package with licences and sources (no models)
        run: python standalone/package.py
      - name: Wine installer, COM engine, real speech and panel tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python standalone/ci_smoke.py
      - name: Native Windows SAPI, installer and panel tests
        if: runner.os == 'Windows'
        run: python standalone/ci_smoke.py
      - name: Upload program packages and diagnostic evidence (no model weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opensapi-standalone-${{ runner.os }}-${{ github.run_id }}
          path: |
            standalone-dist/*.AppImage
            standalone-dist/*.zip
            standalone-dist/*.gz
            standalone-dist/SHA256SUMS
            build/standalone-ci/*.log
            build/standalone-ci/*.wav
            build/standalone-ci/*.png
