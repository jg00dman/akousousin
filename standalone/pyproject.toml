[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "akousousin-control-panel"
version = "0.7.0b5"
requires-python = ">=3.12,<3.13"
license = {text = "GPL-3.0-or-later"}
dependencies = ["akousousin-backend==0.3.0b1", "PySide6-Essentials==6.8.3", "psutil==7.0.0", "packaging==25.0"]
[project.optional-dependencies]
recognition = ["akousousin-backend[recognition]==0.3.0b1", "dbus-next==0.2.3; sys_platform == 'linux'"]

[project.scripts]
akousousin = "akousousin_app.main:main"
[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["akousousin_app*"]
