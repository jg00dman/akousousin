[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensapi-backend"
version = "0.2.0b1"
requires-python = ">=3.10"
description = "Local, bounded Piper speech service for OpenSAPI"
license = {text = "GPL-3.0-or-later"}
dependencies = ["piper-tts==1.8.0", "waitress==3.0.2"]

[project.scripts]
opensapi-piper = "opensapi_backend.server:main"

[tool.setuptools.packages.find]
include = ["opensapi_backend*"]
