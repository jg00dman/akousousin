[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akousousin-backend"
version = "0.2.0b1"
requires-python = ">=3.10"
description = "Local, bounded Piper speech service for Akousousin"
license = {text = "GPL-3.0-or-later"}
dependencies = ["piper-tts==1.8.0", "waitress==3.0.2"]

[project.scripts]
akousousin-piper = "akousousin_backend.server:main"

[tool.setuptools.packages.find]
include = ["akousousin_backend*"]
